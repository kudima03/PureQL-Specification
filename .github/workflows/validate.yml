name: Validate

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    # A validation regression is exponential: fail fast instead of hanging.
    timeout-minutes: 10

    # ajv prints every file it checks to stdout, and for an invalid query the
    # whole error list: over 10 000 lines. Steps below discard stdout. A file
    # that fails its test is reported on stderr, which stays in the log
    # (with the errors of a valid query that was rejected), so only failures
    # are shown, plus one summary line per step.
    # npm deprecation notices come from ajv-cli's own dependencies; hide them.
    env:
      npm_config_loglevel: error

    steps:
      # Fetch the schema and samples of the pull request.
      - uses: actions/checkout@v4

      # The schema must be exactly what the generator writes: 2-space
      # indent, a final newline and no duplicate keys. jsonlint --check
      # reformats it in memory, prints a diff if the file differs, and fails;
      # it also rejects a duplicate key outright.
      - name: Schema is formatted
        run: >
          npx --yes @prantlf/jsonlint@17.0.1 --check --indent 2 --trailing-newline
          --no-duplicate-keys PureQL-Specification.json

      # Samples are formatted the same way as the schema: 2-space indent,
      # every object and array expanded, a final newline, no duplicate keys.
      # --continue reports every file that differs, not only the first.
      - name: Samples are formatted
        run: >
          npx --yes @prantlf/jsonlint@17.0.1 --check --continue --indent 2 --trailing-newline
          --no-duplicate-keys "samples/valid/*.json"

      # Every query in samples/valid, .json samples and .jsonc tests, must be
      # accepted. `ajv test --valid` fails if any file is rejected. The tests hold
      # the deep nesting query that guards against exponential validation.
      # --strict=false allows the root `version` keyword, which is not part
      # of JSON Schema.
      - name: Valid queries must pass
        run: |
          npx --yes ajv-cli@5.0.0 test --spec=draft2020 --strict=false \
            -s PureQL-Specification.json -d "samples/valid/*.json" -d "samples/valid/*.jsonc" --valid > /dev/null
          echo "$(ls samples/valid/*.json samples/valid/*.jsonc | wc -l) valid queries accepted"

      # Every query in samples/invalid must be rejected. `ajv test --invalid`
      # checks each file on its own and fails if any one of them is accepted.
      # Test files are JSONC: a `//` comment with the case description,
      # then the bare query. A file that does not parse fails the step too.
      - name: Invalid queries must fail
        run: |
          npx --yes ajv-cli@5.0.0 test --spec=draft2020 --strict=false \
            -s PureQL-Specification.json -d "samples/invalid/*.jsonc" --invalid > /dev/null
          echo "$(ls samples/invalid/*.jsonc | wc -l) invalid queries rejected"
