name: Validate

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    # A validation regression is exponential: fail fast instead of hanging.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install jsonschema
        run: pip install jsonschema --quiet

      - name: Check generated files are up to date
        run: |
          python3 tools/generate_schema.py
          python3 tools/make_invalid_tests.py
          if ! git diff --exit-code -- PureQL-Specification.json tests/invalid \
             || [ -n "$(git status --porcelain -- PureQL-Specification.json tests/invalid)" ]; then
            echo "::error::PureQL-Specification.json or tests/invalid is out of date. Run tools/generate_schema.py and tools/make_invalid_tests.py and commit the result."
            exit 1
          fi

      - name: Validate samples (must pass) and invalid tests (must fail)
        run: python3 tools/run_tests.py
