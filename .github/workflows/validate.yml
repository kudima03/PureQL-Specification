name: Validate

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    # A validation regression is exponential: fail fast instead of hanging.
    timeout-minutes: 10
    steps:
      # Fetch the schema, samples and tests of the pull request.
      - uses: actions/checkout@v4

      # Every sample and every query in tests/valid must be accepted.
      # `ajv test --valid` fails if any file is rejected. tests/valid holds
      # the deep nesting query that guards against exponential validation.
      # --strict=false allows the root `version` keyword, which is not part
      # of JSON Schema.
      - name: Valid queries must pass
        run: >
          npx --yes ajv-cli@5.0.0 test --spec=draft2020 --strict=false
          -s PureQL-Specification.json -d "samples/*.json" -d "tests/valid/*.jsonc" --valid

      # Every query in tests/invalid must be rejected. `ajv test --invalid`
      # checks each file on its own and fails if any one of them is accepted.
      # Test files are JSONC: a `//` comment with the case description,
      # then the bare query. A file that does not parse fails the step too.
      - name: Invalid queries must fail
        run: >
          npx --yes ajv-cli@5.0.0 test --spec=draft2020 --strict=false
          -s PureQL-Specification.json -d "tests/invalid/*.jsonc" --invalid
