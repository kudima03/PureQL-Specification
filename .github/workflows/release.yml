name: Release

on:
  push:
    tags:
      - '*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # ajv prints every file it checks to stdout, and for an invalid query the
    # whole error list: over 10 000 lines. Steps below discard stdout. A file
    # that fails its test is reported on stderr, which stays in the log
    # (with the errors of a valid query that was rejected), so only failures
    # are shown, plus one summary line per step.
    # npm deprecation notices come from ajv-cli's own dependencies; hide them.
    env:
      npm_config_loglevel: error

    steps:
      # Fetch the tagged commit.
      - uses: actions/checkout@v4

      # Same checks as validate.yml, so nothing broken is ever released:
      # every sample and every query in tests/valid must be accepted.
      - name: Valid queries must pass
        run: |
          npx --yes ajv-cli@5.0.0 test --spec=draft2020 --strict=false \
            -s PureQL-Specification.json -d "samples/*.json" -d "tests/valid/*.jsonc" --valid > /dev/null
          echo "$(ls samples/*.json tests/valid/*.jsonc | wc -l) valid queries accepted"

      # Every query in tests/invalid must be rejected, each file on its own.
      - name: Invalid queries must fail
        run: |
          npx --yes ajv-cli@5.0.0 test --spec=draft2020 --strict=false \
            -s PureQL-Specification.json -d "tests/invalid/*.jsonc" --invalid > /dev/null
          echo "$(ls tests/invalid/*.jsonc | wc -l) invalid queries rejected"

      # The tag must equal the `version` field of the schema, so a release
      # never ships a schema that names another version. jq is preinstalled
      # on GitHub runners.
      - name: Verify schema version matches tag
        run: |
          SCHEMA_VER=$(jq -r '.version // ""' PureQL-Specification.json)
          if [ "$SCHEMA_VER" != "$GITHUB_REF_NAME" ]; then
            echo "ERROR: schema version '$SCHEMA_VER' does not match tag '$GITHUB_REF_NAME'"
            exit 1
          fi

      # The release body is the CHANGELOG.md section of this version: the
      # lines between "## [<tag>]" and the next "## [" heading, without
      # leading blank lines. A placeholder is used if there is no section.
      - name: Extract changelog notes
        run: |
          awk -v header="## [$GITHUB_REF_NAME]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "No changelog entry found for this version." > release_notes.txt
          fi

      # Samples ship as one archive next to the schema.
      - name: Package samples
        run: zip -r samples.zip samples/

      # Publish the release with its assets; a tag containing "-preview"
      # is marked as a pre-release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *"-preview"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --title "PureQL $TAG" \
            --notes-file release_notes.txt \
            $PRERELEASE_FLAG \
            PureQL-Specification.json \
            samples.zip \
            CHANGELOG.md \
            README.md
